[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Not published: install it from a checkout next to the package (evaluation and
# the export parity check run the exported models with netra_nmt.inference):
#   bash training/setup.sh       (or: pip install -e ".[cpu]" -e training)
[project]
name = "netra-nmt-train"
version = "0.0.0"
description = "Training, fine-tuning, evaluation and export for Netra NMT."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "netra-nmt",       # the package: text preparation, and running exported folders
    "torch>=2.0",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "khmercut",
    "tqdm",
    "numpy",
    "datasets",        # Hugging Face training / test sets
    "huggingface_hub", # the published checkpoint
    "sacrebleu>=2.3.1",# spBLEU / chrF++ / TER
    "onnx",            # exporting models for the package
    "onnxscript",
]

[project.optional-dependencies]
# The data recipe (netra_nmt_train/scripts/recipe/01..08d) and the paper metrics.
recipe = ["pandas", "pyarrow", "langdetect", "fasttext-wheel", "accelerate", "transformers>=4.40"]
metrics = ["unbabel-comet>=2.2.0", "bert-score>=0.3.13"]

[project.scripts]
netra-nmt-train = "netra_nmt_train.cli:main"

[tool.setuptools.packages.find]
include = ["netra_nmt_train*"]


